[Service]
RuntimeDirectory=lixx-swaync
RuntimeDirectoryMode=0700
ExecStartPre=%D/lixx-system/bin/lixx-swaync-config
ExecStart=
ExecStart=/usr/bin/swaync --config %t/lixx-swaync/config.json
ExecReload=
ExecReload=%D/lixx-system/bin/lixx-swaync-config
ExecReload=/usr/bin/swaync-client --reload-config
ExecReload=/usr/bin/swaync-client --reload-css
