$color = rgba(30,30,46, 1.0)
$inner_color = rgba(30,30,46, 0.8)
$outer_color = rgba(205,214,244, 1.0)
$font_color = rgba(205,214,244, 1.0)
$check_color = rgba(137,180,250, 1.0)

general {
    ignore_empty_input = true
    disable_screencopy = true  # The lock screen uses the installed wallpaper.
}

background {
    monitor =
    color = $color
    path = $XDG_CONFIG_HOME/hypr/selected-wallpaper
    blur_passes = 3
}

animations {
    enabled = true
    # Release the lock immediately even if the display powers down during authentication.
    animation = fadeOut, 0
}

input-field {
    monitor =
    size = 400, 50
    position = 0, 0
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 4

    font_family = CaskaydiaMono Nerd Font
    font_color = $font_color

    placeholder_text = <span> Enter Password 󰈷 </span>
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}
